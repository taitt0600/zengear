services:
  zengear.api:
    image: ${DOCKER_REGISTRY-}zengearapi
    build:
      context: .
      dockerfile: src/ZenGear.Api/Dockerfile
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
