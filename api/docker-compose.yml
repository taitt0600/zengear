services:
  zengear.api:
    image: ${DOCKER_REGISTRY-}zengearapi
    build:
      context: .
      dockerfile: src/ZenGear.Api/Dockerfile
    environment:
      - ConnectionStrings__Redis=redis:6379
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  redis:
    image: redis:7.4-alpine
    # The access cache keeps version keys without TTL: Redis must never evict them (R-SEC-07).
    command: ["redis-server", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "6379:6379"

volumes:
  pgdata:
