$kind: http-request
description: |-
  API conventions: the ETag of 02 is stale after the update of 03 (412).
method: PUT
url: '{{baseUrl}}/api/v1/admin/business-locations/{{businessLocationId}}'
order: 10000
headers:
  - key: X-ZenGear-As
    value: '{{adminEmail}}'
  - key: If-Match
    value: '{{etag}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "name": "Bản cũ {{run}}",
      "phone": "02838123456",
      "addressDetail": "123 Lê Lợi",
      "provinceId": 79,
      "wardId": 26734,
      "regularHours": [ { "day": 1, "open": "08:30", "close": "21:30" } ]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 412', () => pm.response.to.have.status(412));
      pm.test('problem type 412', () =>
        pm.expect(pm.response.json().type).to.eql('https://tools.ietf.org/html/rfc9110#section-15.5.13'));
