$kind: http-request
description: |-
  R-LOC-01: on the website, tomorrow (the closed holiday of 03) has no hours and the day after shows its own hours
  (10:00–16:00) instead of its weekly hours; the other days keep theirs; the website shows what the Admin saved.
method: GET
url: '{{baseUrl}}/api/v1/business-locations'
order: 4000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const location = pm.response.json().items[0];
      pm.test('the website shows the saved address', () => {
        pm.expect(location.name).to.eql(`ZenGear Bến Thành ${pm.variables.get('run')}`);
        pm.expect(location.wardName).to.eql('Phường Bến Thành');
        pm.expect(location.phone).to.eql('1900636123');
      });
      pm.test('tomorrow is closed for the holiday', () => {
        pm.expect(location.weekHours[1].date).to.eql(pm.variables.get('holiday'));
        pm.expect(location.weekHours[1].periods).to.eql([]);
      });
      pm.test('the day after shows its own hours instead of the weekly ones', () => {
        pm.expect(location.weekHours[2].date).to.eql(pm.variables.get('shortDay'));
        pm.expect(location.weekHours[2].periods).to.eql([{ open: '10:00', close: '16:00' }]);
      });
      pm.test('the other days keep their weekly hours', () => {
        [0, 3, 4, 5, 6].forEach(i => pm.expect(location.weekHours[i].periods).to.not.be.empty);
      });
      pm.test('the holiday schedule from today on', () =>
        pm.expect(location.specialHours.map(s => s.date)).to.include(pm.variables.get('holiday')));
