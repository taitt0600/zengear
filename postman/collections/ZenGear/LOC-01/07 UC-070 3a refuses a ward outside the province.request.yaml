$kind: http-request
description: |-
  UC-070 3a (acceptance criterion "Phường/xã phải thuộc tỉnh/thành đã chọn"): Phường Hoàn Kiếm (Hà Nội) with TP. Hồ Chí
  Minh is refused with 400, the code WARD_NOT_IN_PROVINCE on the pointer #/wardId; 09 shows nothing changed.
method: PUT
url: '{{baseUrl}}/api/v1/admin/business-locations/{{businessLocationId}}'
order: 7000
headers:
  - key: X-ZenGear-As
    value: '{{adminEmail}}'
  - key: If-Match
    value: '*'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "name": "Sai phường {{run}}",
      "phone": "1900636123",
      "addressDetail": "45 Lê Thánh Tôn",
      "provinceId": 79,
      "wardId": 70,
      "regularHours": [ { "day": 1, "open": "08:00", "close": "21:00" } ]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 400', () => pm.response.to.have.status(400));
      const problem = pm.response.json();
      pm.test('problem type /problems/validation', () => pm.expect(problem.type).to.eql('/problems/validation'));
      pm.test('error WARD_NOT_IN_PROVINCE on #/wardId', () => {
        pm.expect(problem.errors).to.be.an('array');
        pm.expect(problem.errors.map((e) => `${e.pointer} ${e.code}`)).to.include('#/wardId WARD_NOT_IN_PROVINCE');
      });
