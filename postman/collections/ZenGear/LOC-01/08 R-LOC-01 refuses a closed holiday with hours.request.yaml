$kind: http-request
description: |-
  R-LOC-01: a holiday entry replaces the weekly hours of its date, either closed or with its own hours, never both: a
  closed date that also has hours is refused with 400, ruleId R-LOC-01 and the code
  SPECIAL_HOURS_CLOSED_DATE_WITH_HOURS on the pointer #/specialHours; 09 shows nothing changed.
method: PUT
url: '{{baseUrl}}/api/v1/admin/business-locations/{{businessLocationId}}'
order: 8000
headers:
  - key: X-ZenGear-As
    value: '{{adminEmail}}'
  - key: If-Match
    value: '*'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "name": "Lịch sai {{run}}",
      "phone": "1900636123",
      "addressDetail": "45 Lê Thánh Tôn",
      "provinceId": 79,
      "wardId": 26743,
      "regularHours": [ { "day": 1, "open": "08:00", "close": "21:00" } ],
      "specialHours": [
        { "date": "{{holiday}}", "closed": true },
        { "date": "{{holiday}}", "closed": false, "open": "10:00", "close": "16:00" }
      ]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 400', () => pm.response.to.have.status(400));
      const problem = pm.response.json();
      pm.test('problem type /problems/validation', () => pm.expect(problem.type).to.eql('/problems/validation'));
      pm.test('ruleId R-LOC-01', () => pm.expect(problem.ruleId).to.eql('R-LOC-01'));
      pm.test('error SPECIAL_HOURS_CLOSED_DATE_WITH_HOURS on #/specialHours', () => {
        pm.expect(problem.errors).to.be.an('array');
        pm.expect(problem.errors.map((e) => `${e.pointer} ${e.code}`))
          .to.include('#/specialHours SPECIAL_HOURS_CLOSED_DATE_WITH_HOURS');
      });
