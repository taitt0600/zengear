$kind: http-request
description: |-
  R-LOC-01 and UC-070 3a: after 05 to 08 there is still one location, as 03 saved it, with the ETag of 03.
method: GET
url: '{{baseUrl}}/api/v1/business-locations/{{businessLocationId}}'
order: 9000
headers:
  - key: X-ZenGear-As
    value: '{{adminEmail}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('the ETag of 03', () => pm.expect(pm.response.headers.get('ETag')).to.eql(pm.variables.get('etag2')));
      const body = pm.response.json();
      pm.test('as 03 saved it', () => {
        pm.expect(body.name).to.eql(`ZenGear Bến Thành ${pm.variables.get('run')}`);
        pm.expect(body.wardId).to.eql(26743);
        pm.expect(body.regularHours).to.have.lengthOf(12);
      });
      pm.sendRequest({ url: `${pm.variables.get('baseUrl')}/api/v1/business-locations`, method: 'GET' }, (error, list) => {
        pm.test('still exactly one location', () => pm.expect(list.json().totalCount).to.eql(1));
      });
