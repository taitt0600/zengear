$kind: http-request
description: |-
  Set-up: the ETag of the account of 05.
method: GET
url: "{{baseUrl}}/api/v1/admin/staff/{{pendingB}}"
order: 19000
headers:
  - key: X-ZenGear-As
    value: "{{adminEmail}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('still PENDING', () => pm.expect(pm.response.json().status).to.eql('PENDING'));
      pm.variables.set('etagB', pm.response.headers.get('ETag'));
