$kind: http-request
description: |-
  Acceptance criterion 3, R-SEC-03: reject needs staff.approve.
method: POST
url: "{{baseUrl}}/api/v1/admin/staff/{{pendingB}}/reject"
order: 20000
headers:
  - key: X-ZenGear-As
    value: "{{itSupportEmail}}"
  - key: If-Match
    value: "{{etagB}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 403', () => pm.response.to.have.status(403));
      pm.test('problem type /problems/permission-denied', () => pm.expect(pm.response.json().type).to.eql('/problems/permission-denied'));
      pm.test('ruleId R-SEC-03', () => pm.expect(pm.response.json().ruleId).to.eql('R-SEC-03'));
