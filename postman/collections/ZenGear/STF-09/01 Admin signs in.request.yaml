$kind: http-request
description: |-
  The Admin created by tools/dev_reset.ps1 signs in.
method: GET
url: "{{baseUrl}}/api/v1/admin/me"
order: 1000
headers:
  - key: X-ZenGear-As
    value: "{{adminEmail}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('the Admin', () => pm.expect(pm.response.json().email).to.eql(pm.variables.get('adminEmail')));
