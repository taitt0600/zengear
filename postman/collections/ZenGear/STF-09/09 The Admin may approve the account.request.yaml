$kind: http-request
description: |-
  Acceptance criterion 6 (DEC-138): canApprove true for the Admin, who did not create it and manages every role.
method: GET
url: "{{baseUrl}}/api/v1/admin/staff/{{pendingA}}"
order: 9000
headers:
  - key: X-ZenGear-As
    value: "{{adminEmail}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('canApprove true, canWithdraw false', () => {
        pm.expect(pm.response.json().canApprove).to.eql(true);
        pm.expect(pm.response.json().canWithdraw).to.eql(false);
      });
