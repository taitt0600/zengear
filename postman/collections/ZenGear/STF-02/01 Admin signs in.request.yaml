$kind: http-request
description: |-
  The Admin created by tools/dev_reset.ps1 signs in. Sets `run`, the suffix that makes the email and employee code
  of this run unique, `today` and `tomorrow` in Asia/Ho_Chi_Minh (UTC+7, no daylight saving) for the left dates
  (R-USR-07: not after today), and keeps the Admin's id for 09, 17 and 18.
method: GET
url: '{{baseUrl}}/api/v1/me'
order: 1000
headers:
  - key: X-ZenGear-As
    value: '{{adminEmail}}'
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.variables.set('run', Date.now().toString(36));
      const day = offset => new Date(Date.now() + 7 * 3600 * 1000 + offset * 86400 * 1000).toISOString().slice(0, 10);
      pm.variables.set('today', day(0));
      pm.variables.set('tomorrow', day(1));
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const me = pm.response.json();
      pm.test('the Admin', () => pm.expect(me.email).to.eql(pm.variables.get('adminEmail')));
      pm.variables.set('adminId', me.id);
