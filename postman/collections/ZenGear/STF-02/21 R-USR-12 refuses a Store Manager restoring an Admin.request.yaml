$kind: http-request
description: |-
  R-USR-12 (DEC-103): only a caller holding the Admin role restores an account holding it (UC-006, 1e). The caller
  is the fixture Store Manager, who holds staff.disable (postman/fixtures/STF-02.sql). Nothing changes.
method: POST
url: '{{baseUrl}}/api/v1/admin/staff/{{secondAdminId}}/restore'
order: 21000
headers:
  - key: X-ZenGear-As
    value: '{{managerEmail}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 409', () => pm.response.to.have.status(409));
      pm.test('problem type /problems/admin-account-not-restorable', () => pm.expect(pm.response.json().type).to.eql('/problems/admin-account-not-restorable'));
      pm.test('ruleId R-USR-12', () => pm.expect(pm.response.json().ruleId).to.eql('R-USR-12'));
