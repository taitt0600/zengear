$kind: http-request
description: |-
  R-USR-07 (DEC-103): the refusal of 15 changed nothing: the Cashier stays DISABLED by 10, with no left date.
method: GET
url: '{{baseUrl}}/api/v1/admin/staff/{{staffId}}'
order: 16000
headers:
  - key: X-ZenGear-As
    value: '{{adminEmail}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('DISABLED, no left date', () => {
        pm.expect(pm.response.json().status).to.eql('DISABLED');
        pm.expect(pm.response.json().leftDate).to.eql(null);
      });
