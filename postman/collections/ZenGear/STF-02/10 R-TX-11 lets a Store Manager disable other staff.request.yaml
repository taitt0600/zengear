$kind: http-request
description: |-
  R-TX-11 only protects Admin accounts: the Store Manager disables the Cashier of this run.
method: POST
url: '{{baseUrl}}/api/v1/staff/{{staffId}}/disable'
order: 10000
headers:
  - key: X-ZenGear-As
    value: '{{managerEmail}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('DISABLED', () => pm.expect(pm.response.json().status).to.eql('DISABLED'));
