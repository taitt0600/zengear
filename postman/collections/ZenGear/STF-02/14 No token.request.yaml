$kind: http-request
description: |-
  A request without a token is refused before anything else.
method: POST
url: '{{baseUrl}}/api/v1/admin/staff/{{staffId}}/restore'
order: 14000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 401', () => pm.response.to.have.status(401));
