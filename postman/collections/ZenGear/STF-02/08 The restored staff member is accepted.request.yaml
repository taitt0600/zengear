$kind: http-request
description: |-
  R-USR-03: the restored account is ACTIVE and its requests are accepted again.
method: GET
url: '{{baseUrl}}/api/v1/me'
order: 8000
headers:
  - key: X-ZenGear-As
    value: '{{staffEmail}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
