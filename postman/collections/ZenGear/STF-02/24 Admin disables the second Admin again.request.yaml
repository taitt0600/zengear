$kind: http-request
description: |-
  Clean-up: the second Admin of this run ends DISABLED, so repeated runs do not leave ACTIVE Admin accounts behind.
method: POST
url: '{{baseUrl}}/api/v1/admin/staff/{{secondAdminId}}/disable'
order: 24000
headers:
  - key: X-ZenGear-As
    value: '{{adminEmail}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    { "leftDate": "{{today}}" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('DISABLED with today as the left date', () => {
        pm.expect(pm.response.json().status).to.eql('DISABLED');
        pm.expect(pm.response.json().leftDate).to.eql(pm.variables.get('today'));
      });
