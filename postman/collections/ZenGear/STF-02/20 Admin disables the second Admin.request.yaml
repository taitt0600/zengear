$kind: http-request
description: |-
  Set-up for 21: an Admin disables another Admin, who is not the last ACTIVE account holding the Admin role
  (R-TX-11, R-USR-12).
method: POST
url: '{{baseUrl}}/api/v1/admin/staff/{{secondAdminId}}/disable'
order: 20000
headers:
  - key: X-ZenGear-As
    value: '{{adminEmail}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('DISABLED', () => pm.expect(pm.response.json().status).to.eql('DISABLED'));
