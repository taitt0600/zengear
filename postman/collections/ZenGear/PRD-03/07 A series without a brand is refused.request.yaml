$kind: http-request
description: |-
  Acceptance criterion 1: a series always belongs to one brand, so a series without one is a validation error
  (400, errors.brandId).
method: POST
url: '{{baseUrl}}/api/v1/admin/product-series'
order: 7000
headers:
  - key: X-ZenGear-As
    value: '{{adminEmail}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    { "name": "0 Dòng Không Hãng {{run}}" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 400', () => pm.response.to.have.status(400));
      pm.test('the error is on brandId', () => pm.expect(pm.response.json().errors).to.have.property('brandId'));
