$kind: http-request
description: |-
  R-SEC-03, the owner's decision for PRD-03: the Store Manager gets product_series.create by default (synced at
  startup, DEC-095), so manager.fixture@zengear.test of postman/fixtures/STF-01.sql creates a series in brand B.
method: POST
url: '{{baseUrl}}/api/v1/admin/product-series'
order: 20000
headers:
  - key: X-ZenGear-As
    value: '{{managerEmail}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    { "name": "0 Dòng của Quản lý {{run}}", "brandId": "{{brandBId}}" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 201', () => pm.response.to.have.status(201));
      pm.test('active, of brand B', () => {
        pm.expect(pm.response.json().isActive).to.eql(true);
        pm.expect(pm.response.json().brandId).to.eql(pm.variables.get('brandBId'));
      });
