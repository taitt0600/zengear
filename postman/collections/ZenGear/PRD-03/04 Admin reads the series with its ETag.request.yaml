$kind: http-request
description: |-
  UC-013 step 1: the series to edit, with its brand and its ETag kept as `etag` for the rename of 08.
method: GET
url: '{{baseUrl}}/api/v1/admin/product-series/{{seriesId}}'
order: 4000
headers:
  - key: X-ZenGear-As
    value: '{{adminEmail}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('an ETag', () => pm.expect(pm.response.headers.get('ETag')).to.match(/^"\d+"$/));
      pm.variables.set('etag', pm.response.headers.get('ETag'));
      pm.test('the ETag of the POST is the stored version', () =>
        pm.expect(pm.response.headers.get('ETag')).to.eql(pm.variables.get('createdEtag')));
      pm.test('the series of 03, of brand A', () => {
        pm.expect(pm.response.json().id).to.eql(pm.variables.get('seriesId'));
        pm.expect(pm.response.json().brandId).to.eql(pm.variables.get('brandAId'));
      });
