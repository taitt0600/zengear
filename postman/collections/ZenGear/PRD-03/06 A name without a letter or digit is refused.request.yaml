$kind: http-request
description: |-
  A name must give a slug: one without a Latin letter or digit is a validation error (400, the code
  NAME_WITHOUT_LETTER_OR_DIGIT on the pointer #/name).
method: POST
url: '{{baseUrl}}/api/v1/admin/product-series'
order: 6000
headers:
  - key: X-ZenGear-As
    value: '{{adminEmail}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    { "name": "!!!", "brandId": "{{brandAId}}" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 400', () => pm.response.to.have.status(400));
      const problem = pm.response.json();
      pm.test('problem type /problems/validation', () => pm.expect(problem.type).to.eql('/problems/validation'));
      pm.test('error NAME_WITHOUT_LETTER_OR_DIGIT on #/name', () => {
        pm.expect(problem.errors).to.be.an('array');
        pm.expect(problem.errors.map((e) => `${e.pointer} ${e.code}`))
          .to.include('#/name NAME_WITHOUT_LETTER_OR_DIGIT');
      });
