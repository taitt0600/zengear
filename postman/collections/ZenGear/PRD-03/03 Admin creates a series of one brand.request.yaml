$kind: http-request
description: |-
  Acceptance criterion 1, UC-012: a series belongs to exactly one brand; it is created active with a slug made from
  its name. Its id is kept as `seriesId`.
method: POST
url: '{{baseUrl}}/api/v1/admin/product-series'
order: 3000
headers:
  - key: X-ZenGear-As
    value: '{{adminEmail}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    { "name": "0 Dòng Thử {{run}}", "brandId": "{{brandAId}}" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 201', () => pm.response.to.have.status(201));
      pm.test('a Location and an ETag', () => {
        pm.expect(pm.response.headers.get('Location')).to.include('/api/v1/admin/product-series/');
        pm.expect(pm.response.headers.get('ETag')).to.match(/^"\d+"$/);
      });
      const body = pm.response.json();
      pm.variables.set('seriesId', body.id);
      pm.variables.set('createdEtag', pm.response.headers.get('ETag'));
      pm.test('of brand A, active, slug from the name', () => {
        pm.expect(body.brandId).to.eql(pm.variables.get('brandAId'));
        pm.expect(body.name).to.eql('0 Dòng Thử ' + pm.variables.get('run'));
        pm.expect(body.slug).to.eql('0-dong-thu-' + pm.variables.get('run'));
        pm.expect(body.isActive).to.eql(true);
      });
