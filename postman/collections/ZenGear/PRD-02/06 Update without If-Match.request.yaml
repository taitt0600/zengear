$kind: http-request
description: |-
  API conventions: PUT on a resource with an ETag needs If-Match (428 /problems/if-match-required).
method: PUT
url: '{{baseUrl}}/api/v1/admin/brands/{{brandId}}'
order: 6000
headers:
  - key: X-ZenGear-As
    value: '{{adminEmail}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    { "name": "0 Không có If-Match {{run}}", "isActive": true }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 428', () => pm.response.to.have.status(428));
      pm.test('problem type /problems/if-match-required', () =>
        pm.expect(pm.response.json().type).to.eql('/problems/if-match-required'));
