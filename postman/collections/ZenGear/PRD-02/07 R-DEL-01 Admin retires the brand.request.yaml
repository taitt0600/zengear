$kind: http-request
description: |-
  R-DEL-01, UC-011 extension 2a: a brand is retired with isActive false, never deleted.
method: PUT
url: '{{baseUrl}}/api/v1/admin/brands/{{brandId}}'
order: 7000
headers:
  - key: X-ZenGear-As
    value: '{{adminEmail}}'
  - key: Content-Type
    value: 'application/json'
  - key: If-Match
    value: '{{etag}}'
body:
  type: json
  content: |-
    { "name": "0 Hãng Đổi Tên {{run}}", "isActive": false }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.variables.set('etag', pm.response.headers.get('ETag'));
      pm.test('retired', () => pm.expect(pm.response.json().isActive).to.eql(false));
