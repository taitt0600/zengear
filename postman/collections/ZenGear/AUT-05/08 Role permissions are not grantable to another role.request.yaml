$kind: http-request
description: |-
  "Chỉ Admin được thao tác" (owner's decision): role.* are never granted to a role that is not a system role.
method: POST
url: '{{baseUrl}}/api/v1/admin/roles'
order: 8000
headers:
  - key: X-ZenGear-As
    value: '{{adminEmail}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "name": "Quản lý vai trò {{run}}",
      "permissionKeys": ["role.update"]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 400', () => pm.response.to.have.status(400));
      const problem = pm.response.json();
      pm.test('validation', () => pm.expect(problem.type).to.eql('/problems/validation'));
      pm.test('no ruleId', () => pm.expect(problem.ruleId).to.eql(undefined));
      pm.test('#/permissionKeys PERMISSION_NOT_GRANTABLE', () => pm.expect(problem.errors.map(e => `${e.pointer} ${e.code}`)).to.include('#/permissionKeys PERMISSION_NOT_GRANTABLE'));
