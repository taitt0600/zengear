$kind: http-request
description: |-
  R-SEC-12: an account holding a role outside the caller's manageable set is not disabled.
method: POST
url: '{{baseUrl}}/api/v1/admin/staff/{{managerId}}/disable'
order: 20000
headers:
  - key: X-ZenGear-As
    value: '{{itSupportEmail}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 409', () => pm.response.to.have.status(409));
      const problem = pm.response.json();
      pm.test('account-out-of-scope', () => pm.expect(problem.type).to.eql('/problems/account-out-of-scope'));
      pm.test('ruleId R-SEC-12', () => pm.expect(problem.ruleId).to.eql('R-SEC-12'));
