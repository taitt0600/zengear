$kind: http-request
description: |-
  UC-002: name, permissions and max_discount_percent saved (PRM-04); a role created through the API manages no role (R-SEC-12).
method: POST
url: '{{baseUrl}}/api/v1/admin/roles'
order: 5000
headers:
  - key: X-ZenGear-As
    value: '{{adminEmail}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "name": "Ca đêm {{run}}",
      "permissionKeys": ["brand.read"],
      "maxDiscountPercent": 5
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 201', () => pm.response.to.have.status(201));
      const role = pm.response.json();
      pm.test('saved as sent', () => {
        pm.expect(role.name).to.eql(`Ca đêm ${pm.variables.get('run')}`);
        pm.expect(role.permissionKeys).to.eql(['brand.read']);
        pm.expect(role.maxDiscountPercent).to.eql(5);
        pm.expect(role.isSystemRole).to.eql(false);
        pm.expect(role.isDefaultRole).to.eql(false);
      });
      pm.test('R-SEC-12 manages no role', () => pm.expect(role.managedRoles).to.eql([]));
      pm.test('ETag', () => pm.expect(pm.response.headers.get('ETag')).to.be.a('string'));
      pm.variables.set('customRoleId', role.id);
      pm.variables.set('customRoleTag', pm.response.headers.get('ETag'));
