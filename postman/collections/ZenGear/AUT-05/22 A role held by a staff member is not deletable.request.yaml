$kind: http-request
description: |-
  UC-003 3b (R-SEC-01): a role any account holds is not deleted.
method: DELETE
url: '{{baseUrl}}/api/v1/admin/roles/{{customRoleId}}'
order: 22000
headers:
  - key: X-ZenGear-As
    value: '{{adminEmail}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 409', () => pm.response.to.have.status(409));
      const problem = pm.response.json();
      pm.test('role-in-use', () => pm.expect(problem.type).to.eql('/problems/role-in-use'));
      pm.test('no ruleId', () => pm.expect(problem.ruleId).to.eql(undefined));
