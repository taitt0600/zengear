$kind: http-request
description: |-
  UC-003: permissions and discount changed; R-SEC-12: the Admin grants the role a manageable set.
method: PUT
url: '{{baseUrl}}/api/v1/admin/roles/{{customRoleId}}'
order: 9000
headers:
  - key: X-ZenGear-As
    value: '{{adminEmail}}'
  - key: Content-Type
    value: 'application/json'
  - key: If-Match
    value: '{{customRoleTag}}'
body:
  type: json
  content: |-
    {
      "name": "Ca đêm {{run}}",
      "permissionKeys": ["brand.read", "staff.read"],
      "maxDiscountPercent": null,
      "managedRoleIds": ["{{roleCashier}}"]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const role = pm.response.json();
      pm.test('changed', () => {
        pm.expect(role.permissionKeys).to.eql(['brand.read', 'staff.read']);
        pm.expect(role.maxDiscountPercent).to.eql(null);
        pm.expect(role.managedRoles.map(r => r.name)).to.eql(['Cashier']);
      });
      pm.test('new ETag', () => pm.expect(pm.response.headers.get('ETag')).to.not.eql(pm.variables.get('customRoleTag')));
