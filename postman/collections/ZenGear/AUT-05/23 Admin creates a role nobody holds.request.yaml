$kind: http-request
description: |-
  Set-up of 24: a role of this run that no account holds.
method: POST
url: '{{baseUrl}}/api/v1/admin/roles'
order: 23000
headers:
  - key: X-ZenGear-As
    value: '{{adminEmail}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "name": "Tạm {{run}}",
      "permissionKeys": []
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 201', () => pm.response.to.have.status(201));
      pm.variables.set('spareRoleId', pm.response.json().id);
