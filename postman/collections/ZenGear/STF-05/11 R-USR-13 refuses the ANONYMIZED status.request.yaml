$kind: http-request
description: |-
  R-USR-13: `status` takes ACTIVE or DISABLED only; ANONYMIZED accounts are never listed.
method: GET
url: '{{baseUrl}}/api/v1/admin/staff?status=ANONYMIZED'
order: 11000
headers:
  - key: X-ZenGear-As
    value: '{{adminEmail}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 400', () => pm.response.to.have.status(400));
      const problem = pm.response.json();
      pm.test('problem type /problems/validation', () => pm.expect(problem.type).to.eql('/problems/validation'));
      pm.test('ruleId R-USR-13', () => pm.expect(problem.ruleId).to.eql('R-USR-13'));
      pm.test('error STATUS_INVALID on parameter status', () => {
        pm.expect(problem.errors).to.be.an('array');
        pm.expect(problem.errors.map((e) => `${e.parameter} ${e.code}`)).to.include('status STATUS_INVALID');
      });
