$kind: http-request
description: |-
  The Admin created by tools/dev_reset.ps1 signs in. Sets `run`, the suffix that makes the email and employee code
  of this run unique, and `today` in Asia/Ho_Chi_Minh (UTC+7) for the left date; keeps the Admin's id for 05, 06, 10.
method: GET
url: '{{baseUrl}}/api/v1/me'
order: 1000
headers:
  - key: X-ZenGear-As
    value: '{{adminEmail}}'
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.variables.set('run', Date.now().toString(36));
      pm.variables.set('today', new Date(Date.now() + 7 * 3600 * 1000).toISOString().slice(0, 10));
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const me = pm.response.json();
      pm.test('the Admin', () => pm.expect(me.email).to.eql(pm.variables.get('adminEmail')));
      pm.variables.set('adminId', me.id);
