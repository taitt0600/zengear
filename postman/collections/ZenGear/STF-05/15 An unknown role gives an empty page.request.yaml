$kind: http-request
description: |-
  R-USR-13, DEC-105: a valid `roleId` of no role returns an empty page, not an error.
method: GET
url: '{{baseUrl}}/api/v1/admin/staff?roleId=0199a000-0000-7000-8000-0000000000ff'
order: 15000
headers:
  - key: X-ZenGear-As
    value: '{{adminEmail}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('empty page', () => {
        pm.expect(body.items).to.eql([]);
        pm.expect(body.totalCount).to.eql(0);
      });
