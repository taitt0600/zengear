$kind: http-request
description: |-
  Acceptance criterion 2, R-USR-13: `page` and `pageSize` page the list; page 2 of size 1 is the second row of a
  page of size 2 (the order ends with the id, so pages do not overlap).
method: GET
url: '{{baseUrl}}/api/v1/staff?page=2&pageSize=1'
order: 8000
headers:
  - key: X-ZenGear-As
    value: '{{adminEmail}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('page 2 of size 1', () => {
        pm.expect(body.page).to.eql(2);
        pm.expect(body.pageSize).to.eql(1);
        pm.expect(body.items.length).to.eql(1);
        pm.expect(body.totalCount).to.be.at.least(2);
      });
      pm.sendRequest({
        url: `${pm.variables.get('baseUrl')}/api/v1/staff?pageSize=2`,
        method: 'GET',
        header: [{ key: 'Authorization', value: pm.request.headers.get('Authorization') }],
      }, (error, response) => {
        pm.test('the second row of a page of size 2', () => {
          pm.expect(error).to.eql(null);
          pm.expect(response.json().items[1].id).to.eql(body.items[0].id);
        });
      });
