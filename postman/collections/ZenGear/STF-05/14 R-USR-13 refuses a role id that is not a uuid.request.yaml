$kind: http-request
description: |-
  R-USR-13: a `roleId` that is not a uuid is refused by model binding, still naming the rule, with the code
  VALUE_INVALID on the parameter roleId; the problem does not repeat the value sent.
method: GET
url: '{{baseUrl}}/api/v1/admin/staff?roleId=abc'
order: 14000
headers:
  - key: X-ZenGear-As
    value: '{{adminEmail}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 400', () => pm.response.to.have.status(400));
      const problem = pm.response.json();
      pm.test('problem type /problems/validation', () => pm.expect(problem.type).to.eql('/problems/validation'));
      pm.test('ruleId R-USR-13', () => pm.expect(problem.ruleId).to.eql('R-USR-13'));
      pm.test('error VALUE_INVALID on parameter roleId', () => {
        pm.expect(problem.errors).to.be.an('array');
        pm.expect(problem.errors.map((e) => `${e.parameter} ${e.code}`)).to.include('roleId VALUE_INVALID');
      });
      // traceId is hexadecimal and may hold 'abc' by chance; it is not a text of the problem.
      pm.test('the problem names no value sent', () =>
        pm.expect(JSON.stringify({ ...problem, traceId: undefined })).to.not.include('abc'));
