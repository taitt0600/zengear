$kind: http-request
description: |-
  Acceptance criterion 3, R-USR-13, DEC-105: the API takes no search by name, email or phone; such parameters
  are ignored and the list is the same as without them (the web filters the rows it loaded). The values match no
  row, so any search would empty the list; no personal data goes in a URL, even in a test.
method: GET
url: '{{baseUrl}}/api/v1/staff?pageSize=100&q=no-match&name=no-match&email=no-match&phone=no-match'
order: 9000
headers:
  - key: X-ZenGear-As
    value: '{{adminEmail}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.sendRequest({
        url: `${pm.variables.get('baseUrl')}/api/v1/staff?pageSize=100`,
        method: 'GET',
        header: [{ key: 'Authorization', value: pm.request.headers.get('Authorization') }],
      }, (error, response) => {
        pm.test('the list without the parameters read', () => pm.expect(!error && response && response.code, `${error}`).to.eql(200));
        if (error || !response || response.code !== 200) {
          return;
        }
        pm.test('the same list as without the parameters', () => {
          const plain = response.json();
          pm.expect(body.totalCount).to.eql(plain.totalCount);
          pm.expect(body.items.map(r => r.id)).to.eql(plain.items.map(r => r.id));
        });
      });
