$kind: http-request
description: |-
  R-USR-13: at most 100 rows per page.
method: GET
url: '{{baseUrl}}/api/v1/admin/staff?pageSize=101'
order: 13000
headers:
  - key: X-ZenGear-As
    value: '{{adminEmail}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 400', () => pm.response.to.have.status(400));
      const problem = pm.response.json();
      pm.test('problem type /problems/validation', () => pm.expect(problem.type).to.eql('/problems/validation'));
      pm.test('ruleId R-USR-13', () => pm.expect(problem.ruleId).to.eql('R-USR-13'));
      pm.test('error PAGE_SIZE_OUT_OF_RANGE on parameter pageSize', () => {
        pm.expect(problem.errors).to.be.an('array');
        pm.expect(problem.errors.map((e) => `${e.parameter} ${e.code}`)).to.include('pageSize PAGE_SIZE_OUT_OF_RANGE');
      });
