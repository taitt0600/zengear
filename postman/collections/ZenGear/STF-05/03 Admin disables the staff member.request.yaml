$kind: http-request
description: |-
  Set-up: the staff member of this run leaves today (STF-02), so the list shows a DISABLED account with a left
  date.
method: POST
url: '{{baseUrl}}/api/v1/staff/{{staffId}}/disable'
order: 3000
headers:
  - key: X-ZenGear-As
    value: '{{adminEmail}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    { "leftDate": "{{today}}" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('DISABLED', () => pm.expect(pm.response.json().status).to.eql('DISABLED'));
