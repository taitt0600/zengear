$kind: http-request
description: |-
  R-USR-11: a password of the blocklist is refused whatever its case ("password1234" sent in upper case).
method: POST
url: '{{baseUrl}}/api/v1/me/change-password'
order: 6000
headers:
  - key: X-ZenGear-As
    value: '{{staffEmail}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    { "newPassword": "PASSWORD1234" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 400', () => pm.response.to.have.status(400));
      const problem = pm.response.json();
      pm.test('ruleId R-USR-11', () => pm.expect(problem.ruleId).to.eql('R-USR-11'));
      pm.test('error on newPassword', () => pm.expect(problem.errors.newPassword).to.be.an('array').that.is.not.empty);
