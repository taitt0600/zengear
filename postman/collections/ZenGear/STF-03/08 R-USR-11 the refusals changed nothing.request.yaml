$kind: http-request
description: |-
  R-USR-11: a refused password leaves the flag set (and Firebase untouched): the change is still pending.
method: GET
url: '{{baseUrl}}/api/v1/me'
order: 8000
headers:
  - key: X-ZenGear-As
    value: '{{staffEmail}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('password change still pending', () => pm.expect(pm.response.json().mustChangePassword).to.eql(true));
