$kind: http-request
description: |-
  R-USR-03: while the password change is pending, only GET /api/v1/me and the password change are open; renaming
  is refused.
method: PATCH
url: '{{baseUrl}}/api/v1/me'
order: 4000
headers:
  - key: X-ZenGear-As
    value: '{{staffEmail}}'
  - key: If-Match
    value: '*'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    { "name": "Tên mới" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 403', () => pm.response.to.have.status(403));
      pm.test('problem type /problems/password-change-required', () =>
        pm.expect(pm.response.json().type).to.eql('/problems/password-change-required'));
      pm.test('ruleId R-USR-03', () => pm.expect(pm.response.json().ruleId).to.eql('R-USR-03'));
