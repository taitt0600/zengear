$kind: http-request
description: |-
  R-USR-04: the display name cannot be blank (400 on name).
method: PATCH
url: '{{baseUrl}}/api/v1/me'
order: 17000
headers:
  - key: X-ZenGear-As
    value: '{{staffEmail}}'
  - key: If-Match
    value: '*'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    { "name": "   " }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 400', () => pm.response.to.have.status(400));
      pm.test('error on name', () => pm.expect(pm.response.json().errors.name).to.be.an('array').that.is.not.empty);
