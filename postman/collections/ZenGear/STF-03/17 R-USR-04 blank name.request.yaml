$kind: http-request
description: |-
  R-USR-04: the display name cannot be blank (400 validation problem, the code NAME_REQUIRED on the pointer #/name).
  An input error of the name carries no ruleId: the API names a rule only for R-USR-11.
method: PATCH
url: '{{baseUrl}}/api/v1/admin/me'
order: 17000
headers:
  - key: X-ZenGear-As
    value: '{{staffEmail}}'
  - key: If-Match
    value: '*'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    { "name": "   " }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 400', () => pm.response.to.have.status(400));
      const problem = pm.response.json();
      pm.test('problem type /problems/validation', () => pm.expect(problem.type).to.eql('/problems/validation'));
      pm.test('error NAME_REQUIRED on #/name', () => {
        pm.expect(problem.errors).to.be.an('array');
        pm.expect(problem.errors.map((e) => `${e.pointer} ${e.code}`)).to.include('#/name NAME_REQUIRED');
      });
      pm.test('no ruleId', () => pm.expect(problem).to.not.have.property('ruleId'));
