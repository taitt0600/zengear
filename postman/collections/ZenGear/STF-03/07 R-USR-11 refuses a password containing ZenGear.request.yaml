$kind: http-request
description: |-
  R-USR-11: a password that contains "zengear" in any case is refused, however long.
method: POST
url: '{{baseUrl}}/api/v1/admin/me/change-password'
order: 7000
headers:
  - key: X-ZenGear-As
    value: '{{staffEmail}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    { "newPassword": "Cua-hang-ZenGear-{{run}}" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 400', () => pm.response.to.have.status(400));
      const problem = pm.response.json();
      pm.test('problem type /problems/validation', () => pm.expect(problem.type).to.eql('/problems/validation'));
      pm.test('ruleId R-USR-11', () => pm.expect(problem.ruleId).to.eql('R-USR-11'));
      pm.test('error PASSWORD_CONTAINS_ZENGEAR on #/newPassword', () => {
        pm.expect(problem.errors).to.be.an('array');
        pm.expect(problem.errors.map((e) => `${e.pointer} ${e.code}`))
          .to.include('#/newPassword PASSWORD_CONTAINS_ZENGEAR');
      });
