$kind: http-request
description: |-
  R-USR-11: the new password has 12 to 128 characters; 11 is refused with 400 and nothing changes (UC-007 3b).
method: POST
url: '{{baseUrl}}/api/v1/admin/me/change-password'
order: 5000
headers:
  - key: X-ZenGear-As
    value: '{{staffEmail}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    { "newPassword": "tra-sua-mot" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 400', () => pm.response.to.have.status(400));
      const problem = pm.response.json();
      pm.test('problem type /problems/validation', () => pm.expect(problem.type).to.eql('/problems/validation'));
      pm.test('ruleId R-USR-11', () => pm.expect(problem.ruleId).to.eql('R-USR-11'));
      pm.test('error PASSWORD_LENGTH_OUT_OF_RANGE on #/newPassword', () => {
        pm.expect(problem.errors).to.be.an('array');
        pm.expect(problem.errors.map((e) => `${e.pointer} ${e.code}`))
          .to.include('#/newPassword PASSWORD_LENGTH_OUT_OF_RANGE');
      });
      pm.test('the password is not echoed', () => pm.expect(pm.response.text()).to.not.include('tra-sua-mot'));
