$kind: http-request
description: |-
  STF-03 acceptance criterion 2: the staff member changes the password again on their own, flag already cleared.
method: POST
url: '{{baseUrl}}/api/v1/me/change-password'
order: 11000
headers:
  - key: X-ZenGear-As
    value: '{{staffEmail}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    { "newPassword": "{{p2}}" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 204', () => pm.response.to.have.status(204));
