$kind: http-request
description: |-
  DEC-094: after the change must_change_password is cleared. The ID token in hand stays valid until it expires (the
  API does not check revocation yet, AUT-06), so the same session reads the account.
method: GET
url: '{{baseUrl}}/api/v1/admin/me'
order: 10000
headers:
  - key: X-ZenGear-As
    value: '{{staffEmail}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('no pending password change', () => pm.expect(pm.response.json().mustChangePassword).to.eql(false));
