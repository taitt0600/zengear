$kind: http-request
description: |-
  DEC-094: Firebase holds the new password. The emulator's password sign-in refuses the password of 09, replaced in 11.
  Emulator only.
method: POST
url: '{{emulatorUrl}}/identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=emulator'
order: 12000
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    { "email": "{{staffEmail}}", "password": "{{p1}}", "returnSecureToken": true }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 400', () => pm.response.to.have.status(400));
      pm.test('no token', () => pm.expect(pm.response.json()).to.not.have.property('idToken'));
