$kind: http-request
description: |-
  DEC-094: the password of 11, kept exactly as typed with its leading and trailing spaces (R-USR-11), signs in;
  the same password without them is refused. Emulator only.
method: POST
url: '{{emulatorUrl}}/identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=emulator'
order: 13000
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    { "email": "{{staffEmail}}", "password": "{{p2}}", "returnSecureToken": true }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('an ID token', () => pm.expect(pm.response.json().idToken).to.be.a('string').that.is.not.empty);
      const emulator = pm.variables.get('emulatorUrl');
      pm.sendRequest({
        url: `${emulator}/identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=emulator`,
        method: 'POST',
        header: [{ key: 'Content-Type', value: 'application/json' }],
        body: { mode: 'raw', raw: JSON.stringify({
          email: pm.variables.get('staffEmail'), password: pm.variables.get('p2').trim(), returnSecureToken: true }) },
      }, (error, trimmed) => {
        pm.test('the password without its spaces is refused', () => pm.expect(trimmed.code).to.eql(400));
      });
