$kind: http-request
description: |-
  The Admin created by tools/dev_reset.ps1 signs in. Also sets `run`, the suffix that makes the email of this run
  unique, and the two new passwords of the run: `p1` (forced change) and `p2` (self change), 12+ characters, on no
  blocklist and without "zengear".
method: GET
url: '{{baseUrl}}/api/v1/me'
order: 1000
headers:
  - key: X-ZenGear-As
    value: '{{adminEmail}}'
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      const run = Date.now().toString(36);
      pm.variables.set('run', run);
      pm.variables.set('p1', `tra-sua-${run}-mot`);
      // A space at each end: 13 shows they are kept (R-USR-11, no trimming).
      pm.variables.set('p2', ` ca phe ${run} hai `);
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('the Admin', () => pm.expect(pm.response.json().email).to.eql(pm.variables.get('adminEmail')));
