$kind: http-request
description: |-
  DEC-102: the password change of the API and its policy are for staff only; a customer (fixture of STF-03) gets
  409 /problems/staff-account-required, before any check of the password.
method: POST
url: '{{baseUrl}}/api/v1/me/change-password'
order: 20000
headers:
  - key: X-ZenGear-As
    value: '{{customerEmail}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    { "newPassword": "short" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 409', () => pm.response.to.have.status(409));
      pm.test('problem type /problems/staff-account-required', () =>
        pm.expect(pm.response.json().type).to.eql('/problems/staff-account-required'));
