$kind: http-request
description: |-
  API conventions: PATCH on a resource with an ETag needs If-Match (428 /problems/if-match-required).
method: PATCH
url: '{{baseUrl}}/api/v1/admin/me'
order: 18000
headers:
  - key: X-ZenGear-As
    value: '{{staffEmail}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    { "name": "Không có If-Match" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 428', () => pm.response.to.have.status(428));
      pm.test('problem type /problems/if-match-required', () =>
        pm.expect(pm.response.json().type).to.eql('/problems/if-match-required'));
