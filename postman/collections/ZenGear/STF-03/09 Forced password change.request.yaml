$kind: http-request
description: |-
  STF-03 acceptance criterion 2 (R-USR-04, DEC-094): the forced change of the default password, within 5 minutes of
  the sign-in of 03, through the API (Firebase Admin SDK).
method: POST
url: '{{baseUrl}}/api/v1/admin/me/change-password'
order: 9000
headers:
  - key: X-ZenGear-As
    value: '{{staffEmail}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    { "newPassword": "{{p1}}" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 204', () => pm.response.to.have.status(204));
