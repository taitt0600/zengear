$kind: http-request
description: |-
  AUT-04, R-SEC-03: the Admin's `permissions` hold the keys of the Admin role, among them staff.read and
  business_location.update; keys only, no role name.
method: GET
url: '{{baseUrl}}/api/v1/admin/me'
order: 1000
headers:
  - key: X-ZenGear-As
    value: '{{adminEmail}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const me = pm.response.json();
      pm.test('the Admin', () => pm.expect(me.email).to.eql(pm.variables.get('adminEmail')));
      pm.test('permissions is a list of keys', () => {
        pm.expect(me.permissions).to.be.an('array');
        me.permissions.forEach(key => pm.expect(key).to.match(/^[a-z_]+\.[a-z_]+$/));
      });
      pm.test('contains staff.read and business_location.update', () =>
        pm.expect(me.permissions).to.include.members(['staff.read', 'business_location.update']));
      pm.test('sorted', () => pm.expect(me.permissions).to.eql([...me.permissions].sort()));
      pm.test('no role names', () => pm.expect(me).to.not.have.any.keys('roles', 'roleNames'));
