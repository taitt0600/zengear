$kind: http-request
description: |-
  Happy path of STF-01: Cashier and Sales Consultant at once. The request has no employee code and no email:
  the API generates them with the username from the name and the joined date (R-USR-24): ZG + 26 + the next
  number of 2026, AnNV + that code, and the code in lower case on zengear.test. The new account must change
  its password (R-USR-03).
method: POST
url: '{{baseUrl}}/api/v1/admin/staff'
order: 2000
headers:
  - key: X-ZenGear-As
    value: '{{adminEmail}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "name": "Nguyễn Văn An",
      "joinedDate": "2026-10-01",
      "workPhone": "0901234567",
      "roleIds": ["{{roleCashier}}", "{{roleSalesConsultant}}"]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 201', () => pm.response.to.have.status(201));
      const staff = pm.response.json();
      pm.test('Location names the new account', () =>
        pm.expect(pm.response.headers.get('Location')).to.match(new RegExp(`/api/v1/admin/staff/${staff.id}$`)));
      pm.test('R-USR-24 employee code ZG + year of the joined date + 4 digits', () =>
        pm.expect(staff.employeeCode).to.match(/^ZG26\d{4}$/));
      pm.test('R-USR-24 username is the abbreviation and the code', () =>
        pm.expect(staff.username).to.eql(`AnNV${staff.employeeCode}`));
      pm.test('R-USR-24 email is the username in lower case on the company domain', () =>
        pm.expect(staff.email).to.eql(`${staff.username.toLowerCase()}@zengear.test`));
      pm.test('profile fields', () => {
        pm.expect(staff.name).to.eql('Nguyễn Văn An');
        pm.expect(staff.joinedDate).to.eql('2026-10-01');
        pm.expect(staff.workPhone).to.eql('0901234567');
        pm.expect(staff.status).to.eql('ACTIVE');
        pm.expect(staff.mustChangePassword).to.eql(true);
      });
      pm.test('two roles', () => pm.expect(staff.roles.map((r) => r.id).sort()).to.eql(
        [pm.variables.get('roleCashier'), pm.variables.get('roleSalesConsultant')].sort()));
      pm.variables.set('staffId', staff.id);
      pm.variables.set('staffEmail', staff.email);
      pm.variables.set('staffCode', staff.employeeCode);
      pm.variables.set('staffUsername', staff.username);
