$kind: http-request
description: |-
  Input validation: 400 with WORK_PHONE_INVALID on #/workPhone. The request has no email or employee code to
  validate: the API generates both (R-USR-24).
method: POST
url: '{{baseUrl}}/api/v1/admin/staff'
order: 14000
headers:
  - key: X-ZenGear-As
    value: '{{adminEmail}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "name": "Nhân viên kiểm thử",
      "joinedDate": "2026-10-01",
      "workPhone": "090-12",
      "roleIds": ["{{roleCashier}}"]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 400', () => pm.response.to.have.status(400));
      const problem = pm.response.json();
      pm.test('problem type /problems/validation', () => pm.expect(problem.type).to.eql('/problems/validation'));
      pm.test('error WORK_PHONE_INVALID on #/workPhone', () =>
        pm.expect(problem.errors.map((e) => `${e.pointer} ${e.code}`)).to.eql(['#/workPhone WORK_PHONE_INVALID']));
