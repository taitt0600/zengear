$kind: http-request
description: |-
  R-USR-03: every endpoint but GET /api/v1/admin/me refuses a staff member who has not changed the default
  password yet (the change comes with STF-03).
method: GET
url: '{{baseUrl}}/api/v1/admin/staff/{{staffId}}'
order: 5000
headers:
  - key: X-ZenGear-As
    value: '{{staffEmail}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 403', () => pm.response.to.have.status(403));
      pm.test('problem type /problems/password-change-required', () => pm.expect(pm.response.json().type).to.eql('/problems/password-change-required'));
