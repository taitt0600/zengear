$kind: http-request
description: |-
  Input validation: 400 with an error for each field, its pointer and its code (EMAIL_INVALID on #/email,
  WORK_PHONE_INVALID on #/workPhone).
method: POST
url: '{{baseUrl}}/api/v1/admin/staff'
order: 14000
headers:
  - key: X-ZenGear-As
    value: '{{adminEmail}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "email": "bad-email",
      "name": "Nhân viên kiểm thử",
      "employeeCode": "{{run}}-14",
      "joinedDate": "2026-10-01",
      "workPhone": "090-12",
      "roleIds": ["{{roleCashier}}"]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 400', () => pm.response.to.have.status(400));
      const problem = pm.response.json();
      pm.test('problem type /problems/validation', () => pm.expect(problem.type).to.eql('/problems/validation'));
      pm.test('errors EMAIL_INVALID on #/email and WORK_PHONE_INVALID on #/workPhone', () => {
        pm.expect(problem.errors).to.be.an('array');
        pm.expect(problem.errors.map((e) => `${e.pointer} ${e.code}`))
          .to.include.members(['#/email EMAIL_INVALID', '#/workPhone WORK_PHONE_INVALID']);
      });
