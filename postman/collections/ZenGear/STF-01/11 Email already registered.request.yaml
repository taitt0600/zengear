$kind: http-request
description: |-
  The email of request 02 again, in upper case: emails compare after normalization (R-USR-02).
method: POST
url: '{{baseUrl}}/api/v1/admin/staff'
order: 11000
headers:
  - key: X-ZenGear-As
    value: '{{adminEmail}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "email": "STF01-{{run}}-CASHIER@zengear.test",
      "name": "Nhân viên kiểm thử",
      "employeeCode": "{{run}}-11",
      "joinedDate": "2026-10-01",
      "workPhone": "0901234567",
      "roleIds": ["{{roleCashier}}"]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 409', () => pm.response.to.have.status(409));
      pm.test('problem type /problems/email-already-registered', () => pm.expect(pm.response.json().type).to.eql('/problems/email-already-registered'));
      pm.test('error EMAIL_ALREADY_REGISTERED on #/email', () => {
        const errors = pm.response.json().errors;
        pm.expect(errors).to.be.an('array').with.lengthOf(1);
        pm.expect(errors[0]).to.include({ pointer: '#/email', code: 'EMAIL_ALREADY_REGISTERED' });
      });
