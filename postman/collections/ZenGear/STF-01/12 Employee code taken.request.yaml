$kind: http-request
description: |-
  A new email with the employee code of request 02.
method: POST
url: '{{baseUrl}}/api/v1/admin/staff'
order: 12000
headers:
  - key: X-ZenGear-As
    value: '{{adminEmail}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "email": "stf01-{{run}}-same-code@zengear.test",
      "name": "Nhân viên kiểm thử",
      "employeeCode": "{{run}}-01",
      "joinedDate": "2026-10-01",
      "workPhone": "0901234567",
      "roleIds": ["{{roleCashier}}"]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 409', () => pm.response.to.have.status(409));
      pm.test('problem type /problems/employee-code-taken', () => pm.expect(pm.response.json().type).to.eql('/problems/employee-code-taken'));
      pm.test('error EMPLOYEE_CODE_TAKEN on #/employeeCode', () => {
        const errors = pm.response.json().errors;
        pm.expect(errors).to.be.an('array').with.lengthOf(1);
        pm.expect(errors[0]).to.include({ pointer: '#/employeeCode', code: 'EMPLOYEE_CODE_TAKEN' });
      });
