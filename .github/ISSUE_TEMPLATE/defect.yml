name: Acceptance defect
description: "One defect found in acceptance testing. The owner fixes it in a local session with /fix-defect <Feature ID> #<issue>."
title: "<Feature ID>: "
labels: [defect]
body:
  - type: markdown
    attributes:
      value: |
        One defect per issue. Start the title with the Feature ID, e.g. `AUT-04: a locked staff account can still sign in`.
        Never paste a token, password, OTP or real personal data.
  - type: input
    id: feature
    attributes:
      label: Feature ID
      placeholder: AUT-04
    validations:
      required: true
  - type: input
    id: pull-request
    attributes:
      label: Pull request tested
      placeholder: "#25"
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: The account or role used, then the API calls (method, path, body) or the screens, in order.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: The status code, the response body or what the screen shows.
    validations:
      required: true
