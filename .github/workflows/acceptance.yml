name: acceptance

# Starts the acceptance environment (docs/ACCEPTANCE.md) and checks that it answers: the database set-up
# completes, the API is healthy, a request without a token is refused and an ID token of the Firebase Auth
# Emulator is accepted. Not a required check: it shows that the environment the owner tests in still starts.
on:
  pull_request:
    paths: ['api/**', 'tools/emulator_token.py', 'docs/ACCEPTANCE.md', '.github/workflows/acceptance.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE: docker compose -f api/acceptance/compose.yml
  API: http://127.0.0.1:8180

jobs:
  smoke:
    name: acceptance smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start the acceptance environment
        run: $COMPOSE up -d --build
      - name: The API is healthy
        run: |
          for _ in $(seq 1 120); do
            if [ "$(curl -s "$API/health")" = "Healthy" ]; then exit 0; fi
            sleep 2
          done
          echo "::error::the API did not answer Healthy on $API/health"
          exit 1
      - name: The database set-up completed
        run: |
          $COMPOSE logs init | grep -q "init: done"
      - name: A token is required, an emulator token is accepted
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' "$API/api/v1/me")
          [ "$status" = "401" ] || { echo "::error::GET /api/v1/me without a token: $status, expected 401"; exit 1; }
          token=$(python3 tools/emulator_token.py smoke@zengear.test smoke-password --create)
          body=$(curl -s -H "Authorization: Bearer $token" "$API/api/v1/me")
          echo "$body" | grep -q 'account-not-registered' \
            || { echo "::error::GET /api/v1/me with an emulator token of an unknown user: $body"; exit 1; }
      # Job logs cannot be read from a cloud session: the end of each service's log becomes an annotation.
      - name: Service logs
        if: failure()
        run: |
          for service in init api firebase postgres; do
            log=$($COMPOSE logs --no-color --tail 30 "$service" 2>&1 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$service log::$log"
          done
