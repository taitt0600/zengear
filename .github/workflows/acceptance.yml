name: acceptance

# Starts the acceptance environment (docs/ACCEPTANCE.md) and checks that it answers: the database set-up
# completes, the API is healthy, a request without a token is refused and an ID token of the Firebase Auth
# Emulator is accepted. Not a required check: it shows that the environment the owner tests in still starts.
on:
  pull_request:
    paths: ['api/**', 'tools/emulator_token.py', 'docs/ACCEPTANCE.md', '.github/workflows/acceptance.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE: docker compose -f api/acceptance/compose.yml
  API: http://127.0.0.1:8180

jobs:
  smoke:
    name: acceptance smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The output goes to files too: on failure their end becomes an annotation (last step).
      - name: Build the images
        run: |
          set -o pipefail
          $COMPOSE --progress plain build 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Start the acceptance environment
        run: |
          set -o pipefail
          $COMPOSE up -d 2>&1 | tee "$RUNNER_TEMP/up.log"
      - name: The API is healthy
        run: |
          for _ in $(seq 1 120); do
            if [ "$(curl -s "$API/health")" = "Healthy" ]; then exit 0; fi
            sleep 2
          done
          echo "::error::the API did not answer Healthy on $API/health"
          exit 1
      - name: The database set-up completed
        run: |
          $COMPOSE logs init | grep -q "init: done"
      - name: A token is required, an emulator token is accepted
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' "$API/api/v1/me")
          [ "$status" = "401" ] || { echo "::error::GET /api/v1/me without a token: $status, expected 401"; exit 1; }
          token=$(python3 tools/emulator_token.py smoke@zengear.test smoke-password --create)
          body=$(curl -s -H "Authorization: Bearer $token" "$API/api/v1/me")
          echo "$body" | grep -q 'account-not-registered' \
            || { echo "::error::GET /api/v1/me with an emulator token of an unknown user: $body"; exit 1; }
      # The emulator exports its accounts when it stops and imports them when it starts: the account of the step
      # above signs in with the same uid after a restart, and the Emulator UI comes back.
      - name: The emulator keeps its accounts across a restart
        run: |
          # The uid line (stderr) of a sign-in; the token (stdout) is not needed.
          uid() { { python3 tools/emulator_token.py smoke@zengear.test smoke-password >/dev/null; } 2>&1; }
          before=$(uid)
          $COMPOSE restart firebase
          after=""
          for _ in $(seq 1 60); do
            if after=$(uid); then break; fi
            sleep 2
          done
          [ "$after" = "$before" ] \
            || { echo "::error::after a restart of the emulator: '$after', expected '$before'"; exit 1; }
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:4000/; then exit 0; fi
            sleep 2
          done
          echo "::error::the Emulator UI did not answer on port 4000 after the restart"
          exit 1
      # Job logs cannot be read from a cloud session: the end of the build output and of each service's log
      # becomes an annotation.
      - name: Logs as annotations
        if: failure()
        run: |
          annotate() {
            text=$(printf '%s' "$2" | sed -e 's/%/%25/g' -e 's/\r//g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            if [ -n "$text" ]; then echo "::error title=$1::$text"; fi
          }
          for step in build up; do
            if [ -f "$RUNNER_TEMP/$step.log" ]; then
              annotate "docker compose $step" "$(grep -v -E '^#[0-9]+ (sha256:|extracting|DONE|CACHED|resolve)' "$RUNNER_TEMP/$step.log" | tail -n 60)"
            fi
          done
          for service in init api firebase postgres; do
            annotate "$service log" "$($COMPOSE logs --no-color --tail 30 "$service" 2>&1)"
          done
