name: secrets

# Secret scan with gitleaks (.gitleaks.toml): the commits of every pull request and push to main,
# and the whole history every week and on demand. Free for repositories of a personal account.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * 1'   # Monday 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read   # the action lists the commits of the pull request

jobs:
  secrets:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.24.3        # same version as the one .gitleaks.toml was tested with
          GITLEAKS_ENABLE_COMMENTS: false # findings go to the job summary and artifact, not PR comments
