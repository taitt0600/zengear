name: gates

# Checks that stand in for a person's approval before auto-merge (tools/pr_gates.py, CLAUDE.md, Workflow), and the
# title of the pull request. pull_request_target runs this file and tools/pr_gates.py as they are on main, so a pull
# request cannot change the gates that judge it. The pull request is read as git objects: nothing of it is checked
# out or run, and the token can only read. The other checks run in pipeline.yml.
on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read
  pull-requests: read
  issues: read   # the app that opened a pull request is recorded on its issue only

concurrency:
  group: gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-gates:
    name: pr-gates
    runs-on: ubuntu-latest
    steps:
      # The read-only token stays in .git/config for the fetch below; no step runs code of the pull request
      # and nothing is uploaded.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch the pull request
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags origin "$HEAD_SHA"
      - name: Check rule coverage, decisions, commit identity and owner files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
          NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! app=$(gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER" --jq '.performed_via_github_app.slug // ""'); then
            echo "::error::cannot read which app opened #$NUMBER (issues API, workflow token)"
            exit 1
          fi
          python3 tools/pr_gates.py check "$BASE_SHA" "$HEAD_SHA" "$TITLE" "$app"

  # The PR title becomes the subject of the merge; it follows Conventional Commits (CLAUDE.md, Commits).
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: |
            api
            web
            db
            seed
            docs
            ci
          requireScope: false
          subjectPattern: ^(?![A-Z]).+[^.]$
          subjectPatternError: |
            The subject "{subject}" must start with a lowercase letter and must not end with a period.
