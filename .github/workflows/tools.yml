name: tools

on:
  push:
    branches: [main]
    paths: ['tools/**', 'docs/**', '.claude/hooks/**', 'api/global.json', '.github/workflows/tools.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tools-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  tools-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: api/global.json
      # pwsh and python3 come with ubuntu-latest. The dossier test reads the real specification, the guard test
      # runs .claude/hooks/guard-spec.ps1 and the env_doctor test reads user-secrets through dotnet.
      - run: python3 -m unittest discover -s tools/tests -v
