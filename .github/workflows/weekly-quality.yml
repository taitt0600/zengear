name: weekly-quality

# What a pull request checks only in part (DEC-152 (7)): the whole mutation testing of ZenGear.Services and of web/src,
# and the external links of the Markdown files. Not a required check; a failure shows in the Actions tab and the
# reports stay as artifacts. Every job is named after its id.
on:
  schedule:
    - cron: '41 3 * * 0'   # Sunday 03:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-quality
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Stryker.NET on the whole of ZenGear.Services with its unit tests (api/stryker-config.json).
  mutation-api:
    name: mutation-api
    runs-on: ubuntu-latest
    timeout-minutes: 60   # 4 minutes on the owner's machine (2026-11-19)
    defaults:
      run:
        working-directory: api/src/ZenGear.Services
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: api/global.json
      - run: dotnet tool restore
      - run: dotnet stryker --config-file ../../stryker-config.json --output "$RUNNER_TEMP/stryker-api"
      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stryker-api-${{ github.sha }}
          path: ${{ runner.temp }}/stryker-api/reports
          if-no-files-found: ignore
          retention-days: 30

  # StrykerJS on the whole of web/src (web/stryker.config.json).
  mutation-web:
    name: mutation-web
    runs-on: ubuntu-latest
    timeout-minutes: 180   # 43 minutes on the owner's machine (2026-11-19), before ignoreStatic
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm exec --no -- stryker run
      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stryker-web-${{ github.sha }}
          path: out/stryker-web/mutation-report.html
          if-no-files-found: ignore
          retention-days: 30

  # lychee with lychee.toml, external links included.
  links:
    name: links
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0 (lychee v0.24.2)
        with:
          args: --config lychee.toml './**/*.md'
          fail: true
