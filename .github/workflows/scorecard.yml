name: scorecard

# OpenSSF Scorecard (DEC-152 (6)): free for a public repository, without GitHub Advanced Security. Its SARIF goes to
# code scanning, where only CodeQL is a required result of the ruleset main, so a Scorecard alert never blocks a merge.
# publish_results sends the result to api.scorecard.dev, which requires (README of ossf/scorecard-action at the pinned
# commit, "Workflow Restrictions"): no env or defaults at the top or in the job, and no run step in the job.
on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: '29 4 * * 1'   # Monday 04:29 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    name: scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write   # the SARIF to code scanning
      id-token: write          # publish_results signs the result with the OIDC token of the job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
