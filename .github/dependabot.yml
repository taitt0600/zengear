# Monthly updates of the GitHub Actions, pinned by commit SHA in .github/workflows.
# NuGet packages get security updates only: "Dependabot security updates" is enabled in the repository
# settings (Settings > Advanced Security), which opens a pull request when an advisory affects a package.
# Title prefixes follow Conventional Commits so the check pr-title passes (CLAUDE.md, Commits).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Ho_Chi_Minh
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  # Security updates for api/ read this entry for their title prefix; no version updates are opened.
  - package-ecosystem: nuget
    directory: /api
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: build(api)

  # The web packages (DEC-104 (4)): a version is proposed once it is 7 days old, and the owner approves each pull
  # request (the exact versions of web/package.json; pr_gates checks every package against
  # web/approved-packages.json). Minor and patch updates come in one pull request, each major one alone.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      timezone: Asia/Ho_Chi_Minh
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(web)
    groups:
      web:
        update-types: ['minor', 'patch']
