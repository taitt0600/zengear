# lychee (DEC-152 (7)): the links of the Markdown files. The job docs-lint of a pull request passes --offline and checks
# only the links between files of the repository; weekly-quality.yml checks the external links too.

# The same files as .markdownlint-cli2.jsonc: generated, vendored and installed ones are left out.
exclude_path = [
  "docs/blueprint",
  "node_modules",
  "out",
  "bin",
  "obj",
  "web/playwright-report",
  "web/test-results",
  "api/TestResults",
  ".claude/guidelines/web-interface-guidelines.md",
  ".claude/skills/shadcn",
]

# The services of the development environment, which exist only on a machine that runs them (CLAUDE.md, Local
# environment), and the placeholders of examples.
exclude = [
  '^https?://(localhost|127\.0\.0\.1)(:\d+)?(/|$)',
  '^https?://([a-z0-9-]+\.)*(example\.(com|org|net)|[a-z0-9-]+\.test)(:\d+)?(/|$)',
  '^mailto:',
]

# A site that limits automated clients answers 429: the link exists.
accept = ["100..=103", "200..=299", "429"]
max_retries = 2
timeout = 20
no_progress = true
